name: TiMi MetaFilter v0.1 - 26 Indicators and Safety Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research_correctness_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'fastapi>=0.115,<1' 'lightgbm>=4.3,<5' 'scikit-learn>=1.5,<2' 'pytest>=8,<10'
      - name: Validate 26 indicator feature contract and MetaFilter
        run: |
          python -m py_compile timi_ml_meta_features.py timi_ml_metafilter.py timi_ml_meta_train.py test_timi_ml_metafilter.py
          python -m pytest -q test_timi_ml_metafilter.py
      - name: No trading / no model activation checks
        run: |
          python - <<'PY'
          from timi_ml_meta_features import FEATURE_KEYS, INDICATOR_KEYS
          from timi_ml_metafilter import meta_gate
          assert len(INDICATOR_KEYS) == 26 and len(FEATURE_KEYS) == 44
          assert meta_gate('LONG', False, .99)[0] == 'BEKLE'
          assert meta_gate('BEKLE', True, .99)[0] == 'BEKLE'
          assert meta_gate('SHORT', True, .99)[0] == 'SHORT'
          print('TiMi MetaFilter: no automatic promotion, no orders')
          PY
