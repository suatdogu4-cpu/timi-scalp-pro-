name: TiMi ML v5.5.3 - Scalp 1 3 5 Minutes

on:
  workflow_dispatch:
    inputs:
      from_month:
        description: 'First complete historical month YYYY-MM'
        required: true
        default: '2026-05'
      to_month:
        description: 'Last complete historical month YYYY-MM'
        required: true
        default: '2026-10'
      funding_mode:
        description: 'Verified funding data: optional/off/required'
        type: choice
        required: true
        default: optional
        options:
          - optional
          - off
          - required

permissions:
  contents: read

concurrency:
  group: timi-ml-v553-scalp-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'lightgbm>=4.3,<5' 'pytest>=8,<10'

      - name: Verify required research files
        run: |
          test -f timi_ml_v54_history_train.py
          test -f timi_ml_v55_research.py
          test -f timi_ml_v551_research.py
          test -f timi_ml_v552_research.py
          test -f timi_ml_v553_scalp.py
          test -f test_v552_research.py
          test -f test_v553_scalp.py
          python -m py_compile timi_ml_v553_scalp.py test_v553_scalp.py

      - name: Run v5.5.2 and v5.5.3 checks
        run: |
          python -m pytest -q test_v552_research.py test_v553_scalp.py

      - name: Train read-only 1 3 and 5 minute scalping candidates
        env:
          FROM_MONTH: ${{ inputs.from_month }}
          TO_MONTH: ${{ inputs.to_month }}
          FUNDING_MODE: ${{ inputs.funding_mode }}
        run: |
          python -u timi_ml_v553_scalp.py \
            --from-month "$FROM_MONTH" \
            --to-month "$TO_MONTH" \
            --funding-mode "$FUNDING_MODE" \
            --output timi_v553_artifacts

      - name: Upload research report and models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-ml-v553-scalp-${{ github.run_number }}
          path: timi_v553_artifacts/
          retention-days: 14
          if-no-files-found: ignore
