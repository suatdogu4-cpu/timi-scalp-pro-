name: TiMi Machine Learning v4 - Selective Research

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Kripto Spot"
        required: true
        type: choice
        default: BTCUSDT
        options:
          - BTCUSDT
          - ETHUSDT
          - SOLUSDT
      bars:
        description: "Dondurulmus egitim donemi kapanmis 1m mum sayisi"
        required: true
        type: choice
        default: "90000"
        options:
          - "60000"
          - "90000"
          - "120000"
      roundtrip_cost_bps:
        description: "Varsayimsal toplam komisyon + spread + kayma (bps)"
        required: true
        type: choice
        default: "12"
        options:
          - "8"
          - "12"
          - "20"

permissions:
  contents: read

jobs:
  train:
    name: ML v4 - offline frozen evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline research dependencies
        run: |
          python -m pip install -r requirements_training.txt
      - name: Verify scripts
        run: python -m py_compile train_model_v4.py ml_features_v4.py ml_features.py
      - name: Train historical and evaluate post-cutoff
        env:
          ML_SYMBOL: ${{ inputs.symbol }}
          ML_BARS: ${{ inputs.bars }}
          ML_COST: ${{ inputs.roundtrip_cost_bps }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
        run: |
          python train_model_v4.py \
            --symbol "$ML_SYMBOL" --interval 1m \
            --bars "$ML_BARS" --horizons 5 15 \
            --asof "2026-11-13T16:29:00+00:00" \
            --roundtrip-cost-bps "$ML_COST" \
            --target-atr 1.5 --stop-atr 1.0 --out models_v4
      - name: Upload v4 research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TiMi-ML-v4-Research-Results
          path: models_v4/
          if-no-files-found: warn
          retention-days: 14
