          end='<!-- TiMi Intelligence v1 END -->'
          if old.count(begin)!=old.count(end) or old.count(begin)>1:
              raise RuntimeError('Daha onceki modul isaretleri bozuk; kurulum durdu')
          before=old.count('<script')
          for name in ('timi_intel_core.js','timi_intel_ui.js'):
              content=Path(name).read_text(encoding='utf-8')
              if re.search(r'</script',content,re.I):raise RuntimeError('Tehlikeli JS inline kapanisi: '+name)
          insert=(begin+'\n'+''.join('<script id="timi-intel-'+name.replace('.js','')+'">\n'+Path(name).read_text(encoding='utf-8').rstrip()+'\n</script>\n' for name in ('timi_intel_core.js','timi_intel_ui.js'))+end+'\n')
          if begin in old:
              old_head,old_rest=old.split(begin,1)
              _,old_tail=old_rest.split(end,1)
              fresh=old_head+insert+old_tail
          else:
              closing=list(re.finditer(r'</body>',old,re.I))
              if len(closing)!=1:raise RuntimeError('Tekil HTML body kapanisi bulunamadi')
              at=closing[0].start()
              fresh=old[:at]+insert+old[at:]
          if fresh.count('<script')!=fresh.count('</script>'):
              raise RuntimeError('HTML script dengesi bozuk')
          if fresh.count('<script')!=before+(0 if begin in old else 2):
              raise RuntimeError('Mevcut JS sayisi beklenmedik sekilde degisti')
          for marker in required:
              if marker not in fresh:raise RuntimeError('Eski modul kaybi: '+marker)
          Path('index_before_timi_intelligence_v1.html').write_text(old,encoding='utf-8')
          html_path.write_text(fresh,encoding='utf-8')
          print('TiMi Intelligence v1: mevcut moduller korunarak 12 gelistirme kuruldu.')
          PY

      - name: Validate JavaScript, signals and HTML preservation
        shell: bash
        run: |
          set -euo pipefail
          node --check timi_intel_core.js
          node --check timi_intel_ui.js
          node test_timi_intel.js
          if test -f test_timi_smc_pro_v35.js; then node test_timi_smc_pro_v35.js; fi
          python3 - <<'PY'
          import re
          from pathlib import Path
