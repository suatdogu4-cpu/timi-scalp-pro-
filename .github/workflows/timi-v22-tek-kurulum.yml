name: TiMi v2.2 - 20 Gelistirme Yol Haritasi ve Veri Guven Merkezi

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timi-v22-health-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Back up current interface
        shell: bash
        run: cp index.html index_before_timi_v22.html
      - name: Build v2.2 source and patch HTML
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,zlib,re
          from pathlib import Path
          sources={
            'timi_22_health.js': '',
            'TiMi_20_Gelistirme_Plani_TR.md': '',
          }
          for name,encoded in sources.items():
              Path(name).write_bytes(zlib.decompress(base64.b64decode(encoded)))
          page=Path('index.html')
          old=page.read_bytes()
          git_blob=hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()
          expected='213aeb889573892a318e898a215b6bf3bae8c241'
          if git_blob != expected:
              raise ValueError('index.html kaynak surumu degismis. Islem otomatik durduruldu; mevcut verileri koruyun.')
          html=old.decode('utf-8')
          if 'id="timi-health22-js"' in html:
              raise ValueError('v2.2 zaten entegre edilmis')
          for marker in ['id="overview"','id="chart"','id="more"',
                         'id="timi-meta-widget-inline"','id="timi-kline-10-1-0"',
                         'id="timi-smc-1-2"','id="timi-pro-suite-v14"',
                         'id="timi-pro-v15"','id="timi-v20-ui"','id="timi-ui-v21-js"']:
              if marker not in html:raise ValueError('Beklenen modül eksik: '+marker)
          js=Path('timi_22_health.js').read_text(encoding='utf-8')
          if '</script' in js.lower():
              raise ValueError('Kaynak kodunda script kapanis etiketi var')
          closing=re.search(r'</body>\s*</html>\s*$',html,re.I)
          if not closing:raise ValueError('HTML kapanisi bulunamadi')
          added=('<!-- TiMi v2.2 - Veri Guven Merkezi: READ ONLY -->\n'
                 '<script id="timi-health22-js">\n'+js.rstrip()+'\n</script>\n')
          result=html[:closing.start()]+added+html[closing.start():]
          assert result.count('<script')==result.count('</script>'), 'Script tag mismatch'
          assert result.count('<style')==result.count('</style>'), 'Style tag mismatch'
          assert result.count('id="timi-health22-js"')==1
          page.write_text(result,encoding='utf-8')
          print('Installed read-only source-quality center and 20-item roadmap; no backend changes.')
          PY
          node --check timi_22_health.js
          git diff --check
      - name: Save original interface for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-before-v22-${{ github.run_number }}
          path: index_before_timi_v22.html
          retention-days: 30
          if-no-files-found: error
      - name: Commit only UI extension and roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html timi_22_health.js TiMi_20_Gelistirme_Plani_TR.md
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$(printf 'TiMi_20_Gelistirme_Plani_TR.md\nindex.html\ntimi_22_health.js')"
          git commit -m 'TiMi v2.2 add read-only market source health panel and 20-feature roadmap'
          git push origin HEAD:main
