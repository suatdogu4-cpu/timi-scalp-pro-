          replace('timi_intel_core.js', '''ambiguous:records.filter(x=>x.ambiguous).length,feeBps,experimental:true''', '''ambiguous:records.filter(x=>x.ambiguous).length,feeBps,experimental:true,entryConvention:'next_open_after_closed_signal' ''', 'backtest entry disclosure')
          replace('timi_intel_core.js', ''' if(flow?.ready&&((side==='LONG'&&flow.ratio<-.23)||(side==='SHORT'&&flow.ratio>.23))){''', ''' if(!flow?.ready){reasons.push('Gerçekleşmiş işlem akışı teyidi yok');return {direction:'BEKLE',reason:reasons.join(' · '),reasons};}
           if((side==='LONG'&&flow.ratio<-.23)||(side==='SHORT'&&flow.ratio>.23)){''', 'require observed flow before Intel direction')
          replace('timi_intel_core.js', '''if(!f(p)||p<=0||!f(spot)||spot<=0||!f(stamp)||now-stamp>120000||now<stamp-10000)return {ready:false,reason:'Zaman uyumlu Futures verisi yok'};''', '''const spotStamp=number(info?.spotTimestamp);if(!f(p)||p<=0||!f(spot)||spot<=0||!f(stamp)||now-stamp>120000||now<stamp-10000||(f(spotStamp)&&Math.abs(spotStamp-stamp)>15000))return {ready:false,reason:'Zaman uyumlu Futures verisi yok'};''', 'Futures timestamp gap guard')
          
          # 5. Single Gateway WebSocket: do not open a redundant direct Binance socket.
          #    Reuse the original gateway event feed for the add-on Intelligence panel.
          replace('index.html', '''renderSoon()};ws.onclose=()=>{''', '''try{window.dispatchEvent(new CustomEvent('timi-gateway-event',{detail:m}))}catch(_){}renderSoon()};ws.onclose=()=>{''', 'shared gateway event hook')
          
          ui = get('timi_intel_ui.js')
