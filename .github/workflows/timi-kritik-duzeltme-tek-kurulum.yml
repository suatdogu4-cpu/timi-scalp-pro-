              c[120]['h']=c[120]['l']-1
              assert not main.closed_candles_valid(c,'1m')
          
          
          def test_mtf_gap_not_accidentally_accepted_as_one_minute():
              c=bars(251, 300000)
              assert main.closed_candles_valid(c, '5m')
              assert not main.closed_candles_valid(c, '1m')
          
          
          def test_reconnect_clears_state_for_every_source():
              s='BTCUSDT';m=main.markets[s]
              m.trades.appendleft({'price':1});m.tape.append((main.now_ms(),'buy',1,1))
              m.book_history.append((main.now_ms(),.9));m.bids=[[1.,1.]]
              m.last_trade_ms=main.now_ms();m.book_valid=True
              main.v2_live.record_trade(s,'buy',1,1,main.now_ms())
              main.v23_live.record_trade(s,'buy',1,1,main.now_ms())
              main.reset_stream_state()
              assert not m.trades and not m.tape and not m.book_history and not m.bids
              assert not m.book_valid and m.last_trade_ms is None
              assert not main.v2_live.buckets[s] and not main.v23_live.trades[s]
          '''
          changed['tests/test_timi_critical_regression.py'] = test
          
          # Transactional postconditions: fail without leaving partially modified files.
          assert get('main.py').count('def reset_stream_state()') == 1
          assert get('main.py').count('def closed_candles_valid(') == 1
          assert get('timi_intel_ui.js').count('wss://stream.binance.com') == 0
          assert get('timi_intel_ui.js').count("'timi-gateway-event'") == 1
          assert get('index.html').count('<script id="timi-intel-timi_intel_core">') == 1
          assert get('index.html').count('<script id="timi-intel-timi_intel_ui">') == 1
          assert get('index.html').count('<script') == get('index.html').count('</script>')
          for name, source in changed.items():
              target = ROOT/name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(source, encoding='utf-8')
              print('PATCHED', name, len(source), 'characters')
          print('DONE: data-quality + reconnect + authoritative signal + next-open backtest + shared WebSocket')
          PY

      - name: Install Node.js 22 for JS regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python 3.11 for regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install live application test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8,<10'

      - name: Validate Python syntax and critical tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py timi_v20_backend.py tests/test_timi_critical_regression.py
          python -m pytest -q tests/test_timi_critical_regression.py

      - name: Validate JavaScript syntax and existing module tests
        shell: bash
        run: |
          set -euo pipefail
          node --check timi_intel_core.js
          node --check timi_intel_ui.js
          node --check test_timi_intel.js
          node test_timi_intel.js
          if test -f test_timi_smc_pro_v35.js; then node test_timi_smc_pro_v35.js; fi

      - name: Protect embedded modules and existing UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf8')
          assert html.count('<script') == html.count('</script>')
          for name in ('timi_intel_core.js','timi_intel_ui.js'):
              original=Path(name).read_text(encoding='utf8').strip()
              assert original in html, name + ' differs from embedded source'
          assert 'timi-gateway-event' in html
          assert '/api/analysis-pro' in html
          assert 'timiProDecision' in html
          assert 'wsUrl()' in html
          assert "wss://stream.binance.com" not in Path('timi_intel_ui.js').read_text()
          print('Embedded source sync and legacy UI anchors verified')
          PY
          git diff --check

      - name: Save pre-installation rollback artifacts even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-critical-fix-originals-${{ github.run_number }}
          path: timi_backup_before_critical_fix/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit only reviewed application and regression-test files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py index.html timi_v20_backend.py timi_intel_core.js timi_intel_ui.js test_timi_intel.js tests/test_timi_critical_regression.py
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes to commit'; exit 0; fi
          if git diff --cached --name-only | grep -Ev '^(main.py|index.html|timi_v20_backend.py|timi_intel_core.js|timi_intel_ui.js|test_timi_intel.js|tests/test_timi_critical_regression.py)$'; then
            echo 'Unexpected file staged! Aborting'; exit 1
          fi
          git commit -m 'TiMi critical: candle validation, reconnect reset, signal veto, next-open backtest'
          git push origin HEAD:main
