             const side=m.trade.side==='buy'?'BUY':m.trade.side==='sell'?'SELL':null;
             if(side&&Number.isFinite(t)&&Math.abs(now-t)<60000&&Number.isFinite(p)&&Number.isFinite(q)&&p>0&&q>0){
