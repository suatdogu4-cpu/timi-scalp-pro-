name: TiMi SCALP PRO - Kritik Veri ve Sinyal Duzeltme v1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timi-scalp-critical-safe-fix
  cancel-in-progress: false

jobs:
  guarded_fix:
    name: Yedekle - Duzelt - Test Et - Guvenli Commit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current working main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Backup working code before any modification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p timi_backup_before_critical_fix
          for f in main.py index.html timi_v20_backend.py timi_intel_core.js timi_intel_ui.js test_timi_intel.js; do
            test -s "$f" || { echo "REQUIRED SOURCE MISSING: $f"; exit 1; }
            cp "$f" timi_backup_before_critical_fix/
          done
          echo "Backup created before patch. No source modifications yet."

      - name: Apply guarded fixes to reviewed source anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          #!/usr/bin/env python3
          """TiMi SCALP PRO guarded hotfix installer (GitHub Actions / local checkout).
          
          Applies only to the reviewed 2026-11-15 source shape. Fails closed if any
          anchor differs. Does not change real-order or paper-order availability.
          """
          from __future__ import annotations
          from pathlib import Path
          import re
          
          ROOT = Path.cwd()
          changed = {}
          
          
          def get(filename):
              return changed.get(filename, (ROOT / filename).read_text(encoding='utf-8'))
          
          
          def set_text(filename, value):
              changed[filename] = value
          
          
          def replace(filename, old, new, label):
              source = get(filename)
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{filename} {label}: expected 1 anchor, got {count}; no files written')
              set_text(filename, source.replace(old, new, 1))
          
          # 1. Reconnect: discard stale market state from previous upstream connection.
          replace('main.py', '''async def relay():
          ''', '''def reset_stream_state():
              """Purge previous Binance connection data before consuming a new session."""
              for m in markets.values():
                  m.price = m.change = m.volume = m.high = m.low = None
                  m.bid = m.ask = None
                  m.bids, m.asks = [], []
                  m.trades.clear()
                  m.tape.clear()
                  m.book_history.clear()
                  m.depth_snapshots.clear()
                  m.wall_seen = {'bid': {}, 'ask': {}}
                  m.last_trade_ms = m.last_book_ms = m.last_ticker_ms = None
                  m.last_trade_id = m.last_book_update_id = None
                  m.book_valid, m.book_error = False, 'Upstream reconnecting'
                  m.live_candle = None
                  m.last_candle_ms = m.last_closed_candle = None
              analysis_cache.clear()
              v2_live.reset_all()
              v23_live.reset_all()
          
          
          async def relay():
          ''', 'upstream purge helper')
          replace('main.py', '''                # Never match snapshots retained from a previous connection.
                          for existing_market in markets.values():
                              existing_market.depth_snapshots.clear()
                          v23_live.reset_all()  # discard all stale observations after a reconnect
          ''', '''                # A fresh upstream connection must not inherit trade/depth evidence.
                          reset_stream_state()
          ''', 'relay purge call')
          replace('main.py', "VERSION = '1.8.4'", "VERSION = '1.8.5'", 'health version bump')
          replace('main.py', 'TiMi SCALP PRO v1.8.4 — read-only Binance Spot analytics.', 'TiMi SCALP PRO v1.8.5 — read-only Binance Spot analytics.', 'docstring version bump')
          replace('index.html', '<title>TiMi SCALP PRO v1.8.4</title>', '<title>TiMi SCALP PRO v1.8.5</title>', 'browser title version bump')
          replace('index.html', '<h3>TiMi SCALP PRO v1.8.4</h3>', '<h3>TiMi SCALP PRO v1.8.5</h3>', 'information tab version bump')
          # Clear ALL browser clients on upstream reset, not only when their own socket reconnects.
          replace('main.py', '''                reset_stream_state()
                          async for raw in ws:
          ''', '''                reset_stream_state()
                          for market_symbol in SYMBOLS:
                              await broadcast(market_symbol, {'type': 'upstream_reset',
                                                              'symbol': market_symbol, 'ts': now_ms()})
                          async for raw in ws:
          ''', 'notify clients on a new upstream session')
          replace('main.py', '''            LOG.warning('Binance stream disconnected: %s', exc)
                      await asyncio.sleep(delay)
