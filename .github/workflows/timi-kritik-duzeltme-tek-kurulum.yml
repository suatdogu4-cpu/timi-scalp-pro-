          replace('timi_intel_ui.js', '''state.symbol=getSymbol();state.gateway=getGateway();void refresh(true);setInterval(()=>{if(d.visibilityState==='visible'){if(state.symbol!==getSymbol()||state.gateway!==getGateway())reset();else void refresh(false);if(state.tradeSocket)update();}},5000);''', '''state.symbol=getSymbol();state.gateway=getGateway();d.addEventListener('timi-gateway-event',onGatewayMessage);startFeed();void refresh(true);setInterval(()=>{if(d.visibilityState==='visible'){if(state.symbol!==getSymbol()||state.gateway!==getGateway())reset();else void refresh(false);if(state.feedOn)update();}},5000);''', 'observe Gateway shared stream by default')
          replace('timi_intel_ui.js', '''<div class="ti-int-note">İşlemler tarayıcı belleğinde en fazla son 5 dakika tutulur. 20 kademe kısmi derinlik gerçek OFI değildir. Bağlantı kapalıyken eski veri gösterilmez.</div>''', '''<div class="ti-int-note">Mevcut TiMi Gateway WebSocket paylaşılır; Binance'e ikinci bağlantı açılmaz. İşlemler tarayıcı belleğinde en fazla son 5 dakika tutulur. 20 kademe kısmi derinlik gerçek OFI değildir. Bağlantı kapalıyken eski veri gösterilmez.</div>''', 'shared socket note')
          replace('timi_intel_ui.js', '''<div class="ti-int-note">Komisyon + kayma için varsayılan 8 baz puan / yön maliyet kullanılır.''', '''<div class="ti-int-note">Sinyal kapandıktan sonraki mumun açılışı varsayımsal giriş fiyatıdır. Komisyon + kayma için varsayılan 8 baz puan / yön maliyet kullanılır.''', 'backtest execution caveat')
          
