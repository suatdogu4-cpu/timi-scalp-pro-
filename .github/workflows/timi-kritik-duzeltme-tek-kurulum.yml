          replace('main.py', '''ind = await asyncio.to_thread(indicators, await get_candles(symbol, tf, 250))''', '''ind = await asyncio.to_thread(indicators, await get_candles(symbol, tf, 250), tf)''', 'MTF interval validation')
          replace('main.py', '''ind = await asyncio.to_thread(indicators, await get_candles(symbol, interval, 250))''', '''ind = await asyncio.to_thread(indicators, await get_candles(symbol, interval, 250), interval)''', 'analysis interval validation')
          replace('main.py', '''asyncio.to_thread(feature_frame, candles, True), timeout=45''', '''asyncio.to_thread(feature_frame, candles, True, interval), timeout=45''', 'all indicators interval validation')
          replace('main.py', '''    if interval == '1m' and (now_ms() - (ind['last_closed_t'] + 60000) > 120000):
