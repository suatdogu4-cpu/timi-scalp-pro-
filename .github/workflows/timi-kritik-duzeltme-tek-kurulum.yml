          # 4. Historical entry must be at the first AVAILABLE open following signal close.
          replace('timi_intel_core.js', '''const take=1.2*a,stop=1.0*a,entry=b[k].c;let outcome=0;''', '''const take=1.2*a,stop=1.0*a,entry=b[k+1].o;let outcome=0;''', 'ML study next-open label')
