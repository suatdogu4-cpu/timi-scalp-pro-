          replace('index.html', "}else if(m.type==='heartbeat'&&!m.upstream_connected){", "}else if(m.type==='upstream_down'||m.type==='upstream_reset'){market={};lastTrade=0;lastBook=0;analysis=null;analysisAt=0;lastKline=0;klineStream=false;lastLiveCandle=null}else if(m.type==='heartbeat'&&!m.upstream_connected){", 'browser stale state reset')
