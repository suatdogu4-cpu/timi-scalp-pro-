          print('TiMi periyot gecisi duzeltildi. Eski grafige donus korundu.')
          print('JS bytes:', len(new_js), 'HTML chars:',len(changed_html))
          PY

      - name: Validate JavaScript syntax and patch markers
        run: |
          node --check timi_kline_chart.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('timi_kline_chart.js').read_text(encoding='utf-8')
          s=html.index('<script id="timi-kline-10-1-0">')
          inline=html[s:].split('>',1)[1].split('</script>',1)[0]
          assert inline.strip()==js.strip()
          assert 'loadSerial' in js
          assert 'chart.setPeriod(PERIODS[p])' in js
          print('HTML/JS senkron, eski TiMi kokpiti korunuyor')
          PY
          git diff --check

      - name: Save original files as downloadable backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-kline-before-period-fix-${{ github.run_number }}
          path: |
            index_before_kline_period_fix.html
            timi_kline_chart_before_period_fix.js
          retention-days: 30
          if-no-files-found: warn

      - name: Commit the two frontend files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html timi_kline_chart.js
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'Fix KLineChart v10 timeframe transitions and stale candle resets'
          git push origin HEAD:main
