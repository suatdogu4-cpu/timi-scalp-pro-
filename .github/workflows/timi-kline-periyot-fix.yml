name: TiMi - KLineChart Periyot Degisimi Hata Duzeltmesi

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timi-klinechart-period-fix-main
  cancel-in-progress: false

jobs:
  fix_period_switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Back up both original files
        run: |
          cp index.html index_before_kline_period_fix.html
          cp timi_kline_chart.js timi_kline_chart_before_period_fix.js

      - name: Apply audited KLineChart period switch correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          root=Path('.')
          js_path=root/'timi_kline_chart.js'
          html_path=root/'index.html'
          original_js=js_path.read_bytes()
          original_html=html_path.read_text(encoding='utf-8')
          expected_git_blob='dce0e12f09d86030cc9d845840d97dfb1f3aa440'
          current_blob=hashlib.sha1(
              ('blob '+str(len(original_js))+'\0').encode('ascii')+original_js
          ).hexdigest()
          if current_blob != expected_git_blob:
              raise ValueError('Mevcut JS dosyasi beklenenden farkli; degisiklik yapilmadi. Kod kontrol edilmeli.')

          tag='<script id="timi-kline-10-1-0">'
          assert original_html.count(tag)==1, 'Grafik eklentisi beklenen yerde yok.'
          start=original_html.index(tag)+len(tag)
          end=original_html.index('</script>',start)
          existing_inline=original_html[start:end]
          assert existing_inline.strip()==original_js.decode('utf-8').strip(), (
              'HTML icindeki KLineChart ile GitHub JS dosyasi farkli; degisiklik yapilmadi.')

