name: "TiMi SCALP PRO - Android APK Olustur (Telefon)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: "TiMi Android APK - WebView Salt Okunur"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: "Java 17 kur"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "Android SDK kur"
        uses: android-actions/setup-android@v3

      - name: "Android 35 paketlerini kur"
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: "Gradle 8.10.2 kur"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: "TiMi Android projesini olustur"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/suatdogu/timiscalppro
          mkdir -p app/src/main/res/values app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'TiMiScalpProAndroid'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.suatdogu.timiscalppro'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.suatdogu.timiscalppro'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_timi"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">TiMi SCALP PRO</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_timi.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0C1C31" android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />
              <path android:fillColor="#F7C65C" android:pathData="M20,29 L88,29 L88,41 L61,41 L61,85 L47,85 L47,41 L20,41 Z" />
              <path android:fillColor="#29D3A3" android:pathData="M20,89 L88,89 L88,96 L20,96 Z" />
          </vector>
          EOF

          cat > app/src/main/java/com/suatdogu/timiscalppro/MainActivity.java <<'EOF'
          package com.suatdogu.timiscalppro;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.SslErrorHandler;
          import android.net.http.SslError;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.graphics.Bitmap;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;

          public final class MainActivity extends Activity {
              private static final String HOME = "https://timi-scalp-pro.onrender.com/";
              private WebView web;
              private FrameLayout root;
              private LinearLayout errorPanel;
              private ProgressBar progress;
              private boolean hasLoadError = false;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(8,17,30));
                  getWindow().setNavigationBarColor(Color.rgb(8,17,30));
                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(8,17,30));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(8,17,30));
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true); // TiMi frontend ihtiyaci
                  settings.setDomStorageEnabled(true); // TiMi ayarlari icin
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setMediaPlaybackRequiresUserGesture(true);
                  if (Build.VERSION.SDK_INT >= 26) settings.setSafeBrowsingEnabled(true);
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView view, int value) {
                          if (progress != null) progress.setVisibility(value == 100 ? View.GONE : View.VISIBLE);
                      }
                  });
                  web.setWebViewClient(new WebViewClient() {
                      @Override public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          hasLoadError = false;
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri url = request.getUrl();
                          if (url != null && "https".equals(url.getScheme()) &&
                              "timi-scalp-pro.onrender.com".equals(url.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, url)); }
                          catch (Exception ignored) { /* Dis baglanti acilamazsa uygulamadan cikma. */ }
                          return true;
                      }
                      @Override public void onPageFinished(WebView view, String url) {
                          if (!hasLoadError && errorPanel != null) errorPanel.setVisibility(View.GONE);
                      }
                      @Override public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) { hasLoadError = true; showError(); }
                      }
                      @Override public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.cancel(); // Gecersiz sertifikada baglanma
                          hasLoadError = true;
                          showError();
                      }
                  });
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setIndeterminate(true);
                  FrameLayout.LayoutParams top = new FrameLayout.LayoutParams(-1, 4, Gravity.TOP);
                  root.addView(progress, top);
                  errorPanel = new LinearLayout(this);
                  errorPanel.setOrientation(LinearLayout.VERTICAL);
                  errorPanel.setGravity(Gravity.CENTER);
                  errorPanel.setPadding(28, 28, 28, 28);
                  errorPanel.setBackgroundColor(Color.rgb(8,17,30));
                  TextView message = new TextView(this);
                  message.setText("TiMi sunucusuna baglanilamadi. Internet veya Render durumunu kontrol edin.");
                  message.setTextColor(Color.WHITE);
                  message.setTextSize(16);
                  message.setGravity(Gravity.CENTER);
                  Button retry = new Button(this);
                  retry.setText("Yeniden dene");
                  retry.setOnClickListener(v -> { errorPanel.setVisibility(View.GONE); web.loadUrl(HOME); });
                  errorPanel.addView(message, new LinearLayout.LayoutParams(-1, -2));
                  errorPanel.addView(retry, new LinearLayout.LayoutParams(-2, -2));
                  root.addView(errorPanel, new FrameLayout.LayoutParams(-1, -1));
                  errorPanel.setVisibility(View.GONE);
                  setContentView(root);
                  web.loadUrl(HOME);
              }
              private void showError() {
                  runOnUiThread(() -> { if (errorPanel != null) errorPanel.setVisibility(View.VISIBLE); });
              }
              @Override public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
              @Override public void onDestroy() {
                  if (root != null && web != null) root.removeView(web);
                  if (web != null) { web.stopLoading(); web.destroy(); web = null; }
                  super.onDestroy();
              }
          }
          EOF

      - name: "APK olustur ve kontrol et"
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/TiMi-SCALP-PRO-Android-Test.apk
          ls -lh output/

      - name: "APK dosyasini indirilebilir yap"
        uses: actions/upload-artifact@v4
        with:
          name: TiMi-SCALP-PRO-Android-APK
          path: output/TiMi-SCALP-PRO-Android-Test.apk
          if-no-files-found: error
          retention-days: 14
