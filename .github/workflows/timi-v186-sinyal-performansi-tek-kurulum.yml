name: TiMi v1.8.6 - Ileriye Donuk Sinyal Performansi Tek Kurulum

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timi-forward-performance-guarded-install
  cancel-in-progress: false

jobs:
  forward_install:
    name: Yedekle - Kur - Test Et - Guvenli Commit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Back up source files before changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p timi_backup_before_forward
          for f in main.py index.html requirements.txt test_timi_intel.js; do
            test -s "$f" || { echo "Missing required $f"; exit 1; }
            cp "$f" timi_backup_before_forward/
          done
          echo "TiMi backup ready. No sources modified."

      - name: Prepare full forward-only modules and guarded installer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          files = {
              'timi_forward_performance.py': '',
              'timi_forward_panel.js': '',
              'timi_forward_panel.css': '',
              'tests/test_timi_forward_performance.py': '',
              'apply_timi_forward.py': '',
          }
          for name, encoded in files.items():
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(encoded))
              print('MATERIALIZED', name, p.stat().st_size)
          PY
          python3 apply_timi_forward.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install existing app and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt 'pytest>=8,<10'

      - name: Test prospective entry, observation gaps, fees and signal isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py timi_forward_performance.py
          python -m pytest -q tests/test_timi_forward_performance.py
          if test -f tests/test_timi_critical_regression.py; then python -m pytest -q tests/test_timi_critical_regression.py; fi
          python - <<'PY'
          import main
          from timi_forward_performance import ForwardTracker
          routes=[getattr(r,'path',None) for r in main.app.routes]
          assert '/api/forward-performance/{symbol}' in routes
          assert '/api/analysis-pro/{symbol}' in routes
          assert '/api/signal-audit/{symbol}' in routes
          assert main.VERSION == '1.8.6'
          assert set(main.AUDIT_SYMBOLS) == set(main.timi_forward.enabled_symbols)
          print('TiMi app import + new/legacy routes + sampler integration: OK')
          PY

      - name: Verify embedded mobile UI and JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check timi_forward_panel.js
          if test -f test_timi_intel.js; then node test_timi_intel.js; fi
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('timi_forward_panel.js').read_text(encoding='utf-8').strip()
          css=Path('timi_forward_panel.css').read_text(encoding='utf-8').strip()
          assert html.count('<script')==html.count('</script>')
          assert html.count('<style')==html.count('</style>')
          assert html.count('<script id="timi-forward-panel">')==1
          assert html.count('<style id="timi-forward-css">')==1
          assert js in html and css in html
          assert 'id="overview"' in html and 'Canlı scalping kararı' in html
          assert '/api/analysis-pro/' in html
          assert "timi-intel-timi_intel_ui" in html
          print('Existing overview and Intelligence modules preserved; new inline panel matches source')
          PY
          git diff --check

      - name: Save rollback source artifacts (even when validation fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-forward-originals-${{ github.run_number }}
          path: timi_backup_before_forward/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit only approved files after all checks pass
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py index.html timi_forward_performance.py timi_forward_panel.js timi_forward_panel.css tests/test_timi_forward_performance.py
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Already installed, no changes.'; exit 0; fi
          if git diff --cached --name-only | grep -Ev '^(main.py|index.html|timi_forward_performance.py|timi_forward_panel.js|timi_forward_panel.css|tests/test_timi_forward_performance.py)$'; then
            echo 'Unexpected file staged, refusing commit'; exit 1
          fi
          git commit -m 'TiMi v1.8.6: forward-only cost-adjusted signal performance and mobile panel'
          git push origin HEAD:main
          {
            echo '### TiMi v1.8.6 kurulum tamamlandi'
            echo 'Veriler forward-only; gercek emir / sanal islem acilmadi.'
            echo 'Yeni panel: Ozet > Ileriye Donuk Sinyal Performansi'
            echo 'API: /api/forward-performance/BTCUSDT'
          } >> "$GITHUB_STEP_SUMMARY"
