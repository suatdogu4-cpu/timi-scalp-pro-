name: TiMi ML v5.5.8 - Spot Long-Only Cost and Regime Audit

on:
  workflow_dispatch:
    inputs:
      from_month:
        description: 'First fully published historical UTC month (YYYY-MM)'
        required: true
        default: '2026-05'
      to_month:
        description: 'Last fully published historical UTC month (YYYY-MM)'
        required: true
        default: '2026-10'
      fee_bps:
        description: 'ASSUMED Spot commission per side, basis points (check your account)'
        required: true
        default: '10'
      slippage_bps:
        description: 'ASSUMED execution slippage per side, basis points (not measured)'
        required: true
        default: '2'

permissions:
  contents: read

concurrency:
  group: timi-v558-spot-edge-historical
  cancel-in-progress: false

jobs:
  spot_edge_research_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install offline research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'lightgbm>=4.3,<5' 'pytest>=8,<10'

      - name: Verify required files and syntax
        run: |
          set -euo pipefail
          for f in \
            timi_ml_v54_history_train.py timi_ml_v55_research.py \
            timi_ml_v551_research.py timi_ml_v552_research.py \
            timi_ml_v553_scalp.py timi_ml_v554_scalp.py \
            timi_ml_v555_meta.py timi_ml_v556_research.py \
            timi_ml_v557_barrier_lab.py timi_ml_v558_spot_edge.py \
            test_v552_research.py test_v553_scalp.py test_v554_scalp.py \
            test_v555_meta.py test_v556_research.py test_v557_barrier_lab.py \
            test_v558_spot_edge.py; do
            test -f "$f" || { echo "MISSING REQUIRED FILE: $f"; exit 1; }
          done
          python -m py_compile timi_ml_v556_research.py timi_ml_v557_barrier_lab.py \
            timi_ml_v558_spot_edge.py test_v558_spot_edge.py

      - name: Run all regression, geometry and Spot audit tests
        run: |
          python -m pytest -q \
            test_v552_research.py test_v553_scalp.py test_v554_scalp.py \
            test_v555_meta.py test_v556_research.py \
            test_v557_barrier_lab.py test_v558_spot_edge.py

      - name: Audit official public historical Spot candles without orders
        env:
          FROM_MONTH: ${{ inputs.from_month }}
          TO_MONTH: ${{ inputs.to_month }}
          FEE_BPS: ${{ inputs.fee_bps }}
          SLIPPAGE_BPS: ${{ inputs.slippage_bps }}
        run: |
          set -euo pipefail
          python -u timi_ml_v558_spot_edge.py \
            --from-month "$FROM_MONTH" \
            --to-month "$TO_MONTH" \
            --fee-bps "$FEE_BPS" \
            --slippage-bps "$SLIPPAGE_BPS" \
            --output timi_v558_artifacts

      - name: Verify 150 variant and non-trading safeguard outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('timi_v558_artifacts')
          report=json.loads((p/'report.json').read_text(encoding='utf-8'))
          quality=json.loads((p/'data_quality.json').read_text(encoding='utf-8'))
          studies=json.loads((p/'spot_edge_experiments.json').read_text(encoding='utf-8'))
          costs=json.loads((p/'cost_audit.json').read_text(encoding='utf-8'))
          with (p/'spot_long_comparison.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert report['experiments']==150 and len(studies)==150 and len(rows)==300
          assert costs['model_trained'] is False and costs['live_promotion_allowed'] is False
          assert report['model_ready_for_live'] is False
          assert report['live_inference_enabled'] is False
          assert report['orders_enabled'] is False
          assert report['reused_research_period_not_independent_oos'] is True
          assert quality['timezone']=='UTC' and quality['synthetic_candles_added']==0
          assert all(x['live_promotion_allowed'] is False for x in studies)
          print('TiMi v5.5.8: 150 historical Spot long-only variants verified; no orders.')
          PY

      - name: Preserve research reports even if part of the run fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-ml-v558-spot-edge-${{ github.run_number }}
          path: timi_v558_artifacts/
          retention-days: 14
          if-no-files-found: ignore
