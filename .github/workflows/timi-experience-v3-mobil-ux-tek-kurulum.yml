      - name: Apply additive UI-only transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_APPLY'
          from pathlib import Path
          import sys
          source=Path('index.html')
          html=source.read_text(encoding='utf-8')
          css=Path('timi_ux_v3.css').read_text(encoding='utf-8').strip()
          js=Path('timi_ux_v3.js').read_text(encoding='utf-8').strip()
          css_tag='<style id="timi-ux-v3-css">\n'+css+'\n</style>\n'
          js_tag='<script id="timi-ux-v3-js">\n'+js+'\n</script>\n'
          css_done='id="timi-ux-v3-css"' in html
          js_done='id="timi-ux-v3-js"' in html
          if css_done and js_done:
            assert css_tag in html and js_tag in html,'Conflicting existing UX v3 install'
            print('Already installed (no-op)')
            sys.exit(0)
          assert not css_done and not js_done,'Partial UI install; refusing to modify'
          for marker in ('<title>TiMi SCALP PRO v1.8.6</title>',
                         '<section id="overview"','<nav class="foot"',
                         'timi-forward-css','timi-ui-v21'):
            assert marker in html, 'Missing expected v1.8.6 marker: '+marker
          assert html.count('</head>')==1 and html.count('</body>')==1
          assert '</script' not in js.lower() and '</style' not in css.lower()
          html=html.replace('</head>',css_tag+'</head>',1)
          html=html.replace('</body>',js_tag+'</body>',1)
          header='v1.8.4 · Suat DOĞU · Salt okunur analiz'
          if header in html:
            html=html.replace(header,'v1.8.6 · Suat DOĞU · Salt okunur analiz',1)
          source.write_text(html,encoding='utf-8')
          print('New UI embedded into existing index.html; original data engine untouched')
          PY_APPLY
      - name: Run JS and original code integrity checks
        shell: bash
        run: |
          set -euo pipefail
          node --check timi_ux_v3.js
          if test -f test_timi_intel.js; then node test_timi_intel.js; fi
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import subprocess,re
          old=subprocess.check_output(['git','show','HEAD:index.html'],text=True,encoding='utf-8')
          new=Path('index.html').read_text(encoding='utf-8')
          css=Path('timi_ux_v3.css').read_text(encoding='utf-8').strip()
          js=Path('timi_ux_v3.js').read_text(encoding='utf-8').strip()
          css_tag='<style id="timi-ux-v3-css">\n'+css+'\n</style>\n'
          js_tag='<script id="timi-ux-v3-js">\n'+js+'\n</script>\n'
          assert new.count(css_tag)==new.count(js_tag)==1
          for tag in ('style','script'):
            assert new.count('<'+tag)==old.count('<'+tag)+1
            assert new.count('</'+tag+'>')==old.count('</'+tag+'>')+1
          restored=new.replace(css_tag,'').replace(js_tag,'')
          if 'v1.8.4 · Suat DOĞU · Salt okunur analiz' in old:
            restored=restored.replace('v1.8.6 · Suat DOĞU · Salt okunur analiz',
                                      'v1.8.4 · Suat DOĞU · Salt okunur analiz',1)
          assert restored==old, 'Unrelated original scripts changed: install refused'
          for forbidden in (r'\bfetch\s*\(',r'new\s+WebSocket\s*\(',
                            r'XMLHttpRequest',r'navigator\.sendBeacon\s*\('):
            assert not re.search(forbidden,js), 'New UI must not call data network: '+forbidden
          assert 'readOnly:true' in js and 'networkCalls:0' in js
          assert '#timiUxHub' in css and 'prefers-reduced-motion' in css
          assert 'timiForwardPerformance' in js
          print('PASS: CSS/JS isolated; all existing scripts preserved')
          print('PASS: no data requests, no trading orders, no new signal calculation')
          print('PASS: live-state, performance navigation, accessible button labels')
          PY_VERIFY
          git diff --check
      - name: Commit only after successful tests
        shell: bash
        run: |
          set -euo pipefail
          git add index.html timi_ux_v3.css timi_ux_v3.js
          if git diff --cached --quiet; then
            echo 'UX v3 already installed. No changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'TiMi Experience v3: mobile UI UX, read-only preserved'
            git push origin HEAD:main
          fi
