name: TiMi Experience v3 - Mobil UI UX Tek Kurulum

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timi-experience-v3-install
  cancel-in-progress: false

jobs:
  ui_ux:
    name: Yedekle - Tasarla - Dogrula - Guvenli Commit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Check base version and save original
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s main.py
          grep -q 'TiMi SCALP PRO v1.8.6' index.html
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          cp index.html "$RUNNER_TEMP/timi-ux-original-index.html"

      - name: Upload original HTML backup
        uses: actions/upload-artifact@v4
        with:
          name: timi-ui-v3-original-${{ github.run_number }}
          path: ${{ runner.temp }}/timi-ux-original-index.html
          retention-days: 30

      - name: Set up Node.js 22 for syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
