        shell: bash
        run: |
          echo '## TiMi Experience v3.0 — Mobil UI/UX' >> "$GITHUB_STEP_SUMMARY"
          echo '✅ TiMi v1.8.6 arayuzune mobil tasarim eklendi.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Ozet: Kontrol merkezi, karar, akıs, performans, veri sagligi, Intelligence kisayollari.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canli veri durumu, mobile uygun butonlar, okunabilir kartlar, sayfa basi tusu.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Veri analizi, WebSocket, ML, sanal/gercek emir davranisi degismedi.' >> "$GITHUB_STEP_SUMMARY"
