                 '<script id="timi-v20-ui">\n'+payloads['timi_v20_ui.js'].rstrip()+'\n</script>\n')
          new_html=old_html[:end.start()]+addon+old_html[end.start():]
          for mark in keep:
              if mark not in new_html:raise ValueError('Kurulum onceki paneli sildi: '+mark)
          if new_html.count('<script')!=new_html.count('</script>'):
              raise ValueError('Script etiketleri dengesiz')
          if new_html.count('id="timi-v20-ui"')!=1:
              raise ValueError('v2.0 script etiketi tekrarlanmis')
          if new_html.count('data-page="proLab"')<1:
              raise ValueError('PRO navigasyon dugmesi kayboldu')
          if 'data-page="flow">' in new_html:
              raise ValueError('Kaldirilan eski Akis alt sekmesi tekrar gorunuyor')

