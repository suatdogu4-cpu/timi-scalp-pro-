          for fn,content in payloads.items():Path(fn).write_text(content,encoding='utf-8')
          html_file.write_text(new_html,encoding='utf-8')
          main_file.write_text(new_main,encoding='utf-8')
          print('PASS: TiMi v2.0 - five read-only modules, two public GET endpoints, four old tabs retained')
