          line=next(x for x in old_main.splitlines() if anchor in x)
          prefix=line[:line.index(anchor)]
          add=anchor+'\n'+prefix+'v2_live.record_trade(symbol, side, qty, price, now)'
          new_main=old_main.replace(anchor,add,1)
          end_anchor='# Read-only analytics. No paper orders, real orders, credentials or training endpoints.'
          if new_main.count(end_anchor)!=1:
              raise ValueError('main.py v2.0 kayit noktasi bulunamadi')
          new_main=new_main.replace(end_anchor, '# TiMi PRO v2.0 - bounded in-memory public market analytics only.\nfrom timi_v20_backend import install_v20\nv2_live = install_v20(app, markets, status, now_ms, lambda: http_client)\n\n'+end_anchor,1)

