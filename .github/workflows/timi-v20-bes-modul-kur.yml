              if re.search(r'</script\s*>',payloads[source],re.I):
                  raise ValueError('Inline JS icerigi script etiketi kapatiyor: '+source)

          end=re.search(r'</body>\s*</html>\s*$',old_html,re.I)
          if not end:raise ValueError('HTML body sonu bulunamadi')
          addon=('<!-- TiMi PRO v2.0: read-only market intelligence, no signal archive -->\n'
