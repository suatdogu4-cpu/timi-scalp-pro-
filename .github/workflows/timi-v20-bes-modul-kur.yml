name: TiMi PRO v2.0 - Bes Profesyonel Modulu Tek Kurulum

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timi-pro-v20-main
  cancel-in-progress: false

jobs:
  install_v20:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
