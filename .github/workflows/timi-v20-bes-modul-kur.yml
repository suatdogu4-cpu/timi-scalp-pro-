          node --check timi_v20_core.js
          node --check timi_v20_ui.js
          git diff --check

      - name: Regression check - no order routes, closed candle guard
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const assert=require('node:assert/strict');
          const x=require('./timi_v20_core.js');
          const t=Date.now(),s=60000;
          const r=[{t:Math.floor(t/s)*s-s,o:10,h:11,l:9,c:10,v:3,closed:true},
                   {t:Math.floor(t/s)*s,o:10,h:11,l:9,c:11,v:3,closed:false}];
          assert.equal(x.candles(r,'1m',t).length,1);
          assert.equal(x.flowRegime(null).direction,'WAIT');
          console.log('PASS closed candle exclusion and missing data fail-safe');
          JS
          python3 - <<'PY'
          from pathlib import Path
          x=Path('timi_v20_backend.py').read_text()
          assert "@app.get('/api/v2/flow/{symbol}')" in x
          assert "@app.get('/api/v2/futures/{symbol}')" in x
          assert '@app.post(' not in x and 'orders/' not in x
          print('PASS GET-only endpoints')
          PY

      - name: Keep 30-day original backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-before-v20-${{ github.run_number }}
          path: |
            index_before_v20.html
            main_before_v20.py
          retention-days: 30
          if-no-files-found: error

      - name: Commit only v2.0 integration files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html main.py timi_v20_backend.py timi_v20_core.js timi_v20_ui.js
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$(printf 'index.html\nmain.py\ntimi_v20_backend.py\ntimi_v20_core.js\ntimi_v20_ui.js')"
          git commit -m 'TiMi PRO v2.0: flow SMC adaptive futures risk read-only suite'
          git push origin HEAD:main
