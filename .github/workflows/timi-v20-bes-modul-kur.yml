        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Back up original app and gateway
        shell: bash
        run: |
          set -euo pipefail
          cp index.html index_before_v20.html
          cp main.py main_before_v20.py

      - name: Install 5 read-only modules, safe version checked
