name: TiMi ML v5.5.7 - ATR Barrier Feasibility Lab (Research Only)

on:
  workflow_dispatch:
    inputs:
      from_month:
        description: 'First complete Binance Vision 1m month (YYYY-MM)'
        required: true
        default: '2026-05'
      to_month:
        description: 'Last complete Binance Vision 1m month (YYYY-MM)'
        required: true
        default: '2026-10'
      funding_mode:
        description: 'Futures funding is NOT Spot cost; off recommended'
        required: true
        type: choice
        options:
          - "off"
          - optional
          - required
        default: "off"
      fee_bps:
        description: 'Commission basis points PER SIDE'
        required: true
        default: '10'
      slippage_bps:
        description: 'Slippage basis points PER SIDE (assumption)'
        required: true
        default: '2'

permissions:
  contents: read

concurrency:
  group: timi-v557-historical-research
  cancel-in-progress: false

jobs:
  research_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'lightgbm>=4.3,<5' 'pytest>=8,<10'
      - name: Verify files and syntax
        run: |
          for f in timi_ml_v54_history_train.py timi_ml_v55_research.py timi_ml_v551_research.py timi_ml_v552_research.py timi_ml_v553_scalp.py timi_ml_v554_scalp.py timi_ml_v555_meta.py timi_ml_v556_research.py timi_ml_v557_barrier_lab.py test_v556_research.py test_v557_barrier_lab.py; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          python -m py_compile timi_ml_v556_research.py timi_ml_v557_barrier_lab.py test_v557_barrier_lab.py
      - name: Offline v5.5.6 regression and v5.5.7 geometry tests
        run: |
          python -m pytest -q test_v556_research.py test_v557_barrier_lab.py
      - name: Run public-historical ATR and cost laboratory (NO ORDERS)
        env:
          FROM_MONTH: ${{ inputs.from_month }}
          TO_MONTH: ${{ inputs.to_month }}
          FUNDING_MODE: ${{ inputs.funding_mode }}
          FEE_BPS: ${{ inputs.fee_bps }}
          SLIPPAGE_BPS: ${{ inputs.slippage_bps }}
        run: |
          set -euo pipefail
          python -u timi_ml_v557_barrier_lab.py \
            --from-month "$FROM_MONTH" \
            --to-month "$TO_MONTH" \
            --funding-mode "$FUNDING_MODE" \
            --fee-bps "$FEE_BPS" \
            --slippage-bps "$SLIPPAGE_BPS" \
            --output timi_v557_artifacts
      - name: Verify research results and safeguards
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          base=Path('timi_v557_artifacts')
          r=json.loads((base/'report.json').read_text(encoding='utf-8'))
          lab=json.loads((base/'barrier_feasibility.json').read_text(encoding='utf-8'))
          quality=json.loads((base/'data_quality.json').read_text(encoding='utf-8'))
          with (base/'barrier_policy_comparison.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(lab)==150 and len(rows)==750
          assert r['experiments']==150
          assert r['live_inference_enabled'] is False
          assert r['orders_enabled'] is False
          assert r['model_ready_for_live'] is False
          assert r['research_period_previously_inspected_no_fresh_out_of_sample'] is True
          assert quality['timezone']=='UTC'
          assert quality['synthetic_candles_added']==0
          print('v5.5.7 150 research comparisons verified; no trained model, no live orders')
          PY
      - name: Upload reports even if analysis fails partway
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-ml-v557-barrier-lab-${{ github.run_number }}
          path: timi_v557_artifacts/
          retention-days: 14
          if-no-files-found: ignore
