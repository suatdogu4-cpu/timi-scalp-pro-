
name: TiMi Machine Learning v2

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Kripto para"
        required: true
        type: choice
        default: BTCUSDT
        options:
          - BTCUSDT
          - ETHUSDT
          - SOLUSDT

      bars:
        description: "1 dakikalik mum sayisi"
        required: true
        type: choice
        default: "60000"
        options:
          - "30000"
          - "60000"
          - "90000"

      cost_bps:
        description: "Nötr bölge (bps) - araştırma eşiği"
        required: true
        type: choice
        default: "12"
        options:
          - "8"
          - "12"
          - "24"

permissions:
  contents: read

jobs:
  train:
    name: TiMi ML v2 Walk-Forward
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install offline training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_training.txt

      - name: Check source syntax
        run: python -m py_compile train_model.py ml_features.py

      - name: Train and evaluate research models
        env:
          TIMI_SYMBOL: ${{ inputs.symbol }}
          TIMI_BARS: ${{ inputs.bars }}
          TIMI_BPS: ${{ inputs.cost_bps }}
        run: |
          python train_model.py \
            --symbol "$TIMI_SYMBOL" \
            --interval 1m \
            --bars "$TIMI_BARS" \
            --horizons 1 5 \
            --cost-bps "$TIMI_BPS" \
            --out models

      - name: Upload model files and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TiMi-ML-v2-Results
          path: models/
          if-no-files-found: warn
          retention-days: 14
