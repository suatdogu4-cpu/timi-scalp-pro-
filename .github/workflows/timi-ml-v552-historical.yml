name: TiMi ML v5.5.2 - Cost Aware Regime Research

on:
  workflow_dispatch:
    inputs:
      from_month:
        description: 'First fully published month YYYY-MM'
        required: true
        default: '2026-05'
      to_month:
        description: 'Last fully published month YYYY-MM'
        required: true
        default: '2026-10'
      funding_mode:
        description: 'Verified funding archive/API: optional, off, required'
        type: choice
        required: true
        default: optional
        options:
          - optional
          - off
          - required

permissions:
  contents: read

concurrency:
  group: timi-ml-v552-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'lightgbm>=4.3,<5' 'pytest>=8,<10'

      - name: Verify files and Python syntax
        run: |
          test -f timi_ml_v54_history_train.py
          test -f timi_ml_v55_research.py
          test -f timi_ml_v551_research.py
          test -f timi_ml_v552_research.py
          test -f test_v552_research.py
          python -m py_compile timi_ml_v54_history_train.py timi_ml_v55_research.py timi_ml_v551_research.py timi_ml_v552_research.py test_v552_research.py

      - name: Run v5.5.2 correctness tests
        run: python -m pytest -q test_v552_research.py

      - name: Run historical cost-aware research
        env:
          FROM_MONTH: ${{ inputs.from_month }}
          TO_MONTH: ${{ inputs.to_month }}
          FUNDING_MODE: ${{ inputs.funding_mode }}
        run: |
          python -u timi_ml_v552_research.py \
            --from-month "$FROM_MONTH" \
            --to-month "$TO_MONTH" \
            --funding-mode "$FUNDING_MODE" \
            --output timi_v552_artifacts

      - name: Upload research-only report and models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-ml-v552-research-${{ github.run_number }}
          path: timi_v552_artifacts/
          retention-days: 14
          if-no-files-found: ignore
