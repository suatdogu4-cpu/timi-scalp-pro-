name: TiMi Intelligence v1.1 - 12 Modul Guvenli Duzeltme

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timi-intelligence-v1-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
