        run: |
          set -euo pipefail
          test -s index.html || { echo 'ERROR: index.html not found'; exit 1; }
          cp index.html index_before_timi_intelligence_v1.html
          echo 'BACKUP OK: index_before_timi_intelligence_v1.html'
          echo 'Current head:'
          git rev-parse --short HEAD

