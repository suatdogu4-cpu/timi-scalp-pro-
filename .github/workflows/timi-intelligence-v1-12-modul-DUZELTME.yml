              expected=old_scripts+2
          if fresh.count('<script')!=fresh.count('</script>') or fresh.count('<script')!=expected:
              raise RuntimeError('Unbalanced script tags: no modification')
          if fresh.count('<style')!=old.count('<style') or fresh.count('</style>')!=old.count('</style>'):
              raise RuntimeError('Style markup changed unexpectedly')
          if not has_timi or 'timi-smc-v35' not in fresh:
              raise RuntimeError('Original TiMi modules not preserved')
          page.write_text(fresh,encoding='utf-8')
          print('INSTALL OK: TiMi Intelligence v1.1 with 12 analytical modules')
          print('New panels attach to existing DOM dynamically; original app scripts untouched')
          PY

      - name: Validate JavaScript and old modules
        shell: bash
        run: |
          set -euo pipefail
          node --check timi_intel_core.js
          node --check timi_intel_ui.js
          node test_timi_intel.js
          if test -f test_timi_smc_pro_v35.js; then node test_timi_smc_pro_v35.js; fi
          python3 - <<'PY'
          from pathlib import Path
          a=Path('index.html').read_text(encoding='utf8')
          b=Path('index_before_timi_intelligence_v1.html').read_text(encoding='utf8')
          for n in ('timi_intel_core.js','timi_intel_ui.js'):
              assert a.count('id="timi-intel-'+n.replace('.js','')+'"')==1
              assert Path(n).read_text(encoding='utf8').strip() in a
          for marker in ('timi-orderflow-v23','timi-health22-js','timi-v20-ui','timi-smc-1-2','timi-meta-widget-inline'):
              if marker in b:assert marker in a,marker
          assert a.count('<script')==a.count('</script>')
          print('PASS: Old modules remain, two analytical scripts inline once')
          PY
          git diff --check

      - name: Upload backup (30 days), including when installation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-before-intelligence-v11-${{ github.run_number }}
          path: index_before_timi_intelligence_v1.html
          retention-days: 30
          if-no-files-found: warn

      - name: Commit only approved files (never main.py)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html timi_intel_core.js timi_intel_ui.js test_timi_intel.js
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Already installed - no changes'; exit 0; fi
          if git diff --cached --name-only | grep -Ev '^(index.html|timi_intel_core.js|timi_intel_ui.js|test_timi_intel.js)$'; then
            echo 'Unexpected staged file; stopped'; exit 1
          fi
          git commit -m 'TiMi Intelligence v1.1 safe additive 12-module install'
          git push origin HEAD:main
