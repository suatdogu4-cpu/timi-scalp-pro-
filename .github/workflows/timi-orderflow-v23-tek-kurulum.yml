name: TiMi - Order Flow PRO 3.0 Tek Kurulum

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timi-orderflow-v23-main
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Back up unmodified files
        shell: bash
        run: |
          set -euo pipefail
          cp main.py main_before_orderflow_v23.py
          cp index.html index_before_orderflow_v23.html

      - name: Build protected new v3 modules and event hooks
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,re,zlib
          from pathlib import Path

          payloads = {
              'timi_v23_orderflow.py': '',
              'timi_v23_orderflow.js': '',
              'test_timi_v23_orderflow.py': '',
          }
          for filename,encoded in payloads.items():
              target = Path(filename)
              if target.exists():
                  raise RuntimeError('Existing file not overwritten: '+filename)
              target.write_bytes(zlib.decompress(base64.b64decode(encoded)))

          def gitblob(blob):
              return hashlib.sha1(b'blob '+str(len(blob)).encode('ascii')+b'\0'+blob).hexdigest()

          def replace_once(src, old, new, location):
              n = src.count(old)
              if n != 1:
                  raise ValueError(f'Patch location mismatch for {location}: occurrences={n}')
              return src.replace(old, new, 1)

          mainp=Path('main.py')
          indexp=Path('index.html')
          mainbytes=mainp.read_bytes()
          indexbytes=indexp.read_bytes()
          if gitblob(mainbytes)!='1a87009510dd1c2d5e5ba43856fa539f85913a4e':
              raise ValueError('main.py SHA changed, abort to prevent overwrites')
          if gitblob(indexbytes)!='eb76fcd56a3f161dcf7213d75100f3b72d1f97e7':
              raise ValueError('index.html SHA changed, abort to prevent overwrites')
          main=mainbytes.decode('utf-8')
          html=indexbytes.decode('utf-8')
          if 'timi_v23_orderflow' in main or 'id="timi-orderflow-v23"' in html:
              raise ValueError('TiMi Order Flow 3.0 already installed')
          main=replace_once(main,
              '                for existing_market in markets.values():\n                    existing_market.depth_snapshots.clear()\n',
              '                for existing_market in markets.values():\n                    existing_market.depth_snapshots.clear()\n                v23_live.reset_all()  # discard all stale observations after a reconnect\n',
              'WebSocket reconnect')
          main=replace_once(main,
              '                        v2_live.record_trade(symbol, side, qty, price, now)\n',
              '                        v2_live.record_trade(symbol, side, qty, price, now)\n                        v23_live.record_trade(symbol, side, qty, price, now)\n',
              'trade tap')
          main=replace_once(main,
              '                            m.book_valid, m.book_error = True, None\n',
              '                            m.book_valid, m.book_error = True, None\n                            v23_live.record_book(symbol, bids, asks, now, m.last_book_update_id)\n',
              'depth tap')
          main=replace_once(main,
              '                            m.bids, m.asks, m.bid, m.ask = [], [], None, None\n',
              '                            m.bids, m.asks, m.bid, m.ask = [], [], None, None\n                            v23_live.invalidate_book(symbol)\n',
              'invalid depth')
          main=replace_once(main,
              'v2_live = install_v20(app, markets, status, now_ms, lambda: http_client)',
              'v2_live = install_v20(app, markets, status, now_ms, lambda: http_client)\n'
              'from timi_v23_orderflow import install_v23\n'
              'v23_live = install_v23(app, markets, status, now_ms)',
              'v3 route install')
          if main.count('v23_live.record_trade(')!=1 or main.count('v23_live.record_book(')!=1:
              raise ValueError('Event taps duplicated or missing')
          required = ['id="overview"','id="chart"','id="more"','id="timi-meta-widget-inline"',
                      'id="timi-kline-10-1-0"','id="timi-smc-1-2"','id="timi-pro-suite-v14"',
                      'id="timi-pro-v15"','id="timi-v20-ui"','id="timi-ui-v21-js"',
                      'id="timi-health22-js"']
          for item in required:
              if item not in html:
                  raise ValueError('Protected module missing: '+item)
          js=Path('timi_v23_orderflow.js').read_text(encoding='utf-8')
          if '</script' in js.lower():
              raise ValueError('Unsafe embedded JS script closing tag')
          close=re.search(r'</body>\s*</html>\s*$',html,re.I)
          if not close:
              raise ValueError('HTML closing tags not found')
          added='<!-- TiMi Order Flow PRO 3.0: read-only -->\n<script id="timi-orderflow-v23">\n'+js.rstrip()+'\n</script>\n'
          html=html[:close.start()]+added+html[close.start():]
          if html.count('<script')!=html.count('</script>') or html.count('<style')!=html.count('</style>'):
              raise ValueError('HTML script/style tags became unbalanced')
          if html.count('id="timi-orderflow-v23"')!=1:
              raise ValueError('New UI inline marker not unique')
          for item in required:
              if item not in html:
                  raise ValueError('Protected module lost: '+item)
          mainp.write_text(main,encoding='utf-8')
          indexp.write_text(html,encoding='utf-8')
          print('TiMi v3.0: recorded bounded trade/bin observations + book deltas in RAM only')
          print('One new read-only GET endpoint: /api/v3/orderflow/{symbol}. No other routes.')
          PY
          python3 -m py_compile main.py timi_v23_orderflow.py
          node --check timi_v23_orderflow.js
          git diff --check

      - name: Install minimal test dependency
        run: python3 -m pip install -q 'fastapi>=0.100,<1'

      - name: Test deterministic Order Flow calculations
        run: python3 -m unittest -v test_timi_v23_orderflow

      - name: Back up original code for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-before-orderflow-v23-${{ github.run_number }}
          path: |
            main_before_orderflow_v23.py
            index_before_orderflow_v23.html
          retention-days: 30
          if-no-files-found: error

      - name: Commit only audited v3 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py index.html timi_v23_orderflow.py timi_v23_orderflow.js test_timi_v23_orderflow.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$(printf 'index.html\nmain.py\ntest_timi_v23_orderflow.py\ntimi_v23_orderflow.js\ntimi_v23_orderflow.py')"
          git commit -m 'TiMi Order Flow PRO 3.0 - ephemeral price bins and partial-depth changes'
          git push origin HEAD:main
