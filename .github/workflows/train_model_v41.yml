
name: TiMi Machine Learning v4.1 - Research

"on":
  workflow_dispatch:
    inputs:
      symbol:
        description: "Spot parite"
        required: true
        type: choice
        default: BTCUSDT
        options: [BTCUSDT, ETHUSDT, SOLUSDT]
      bars:
        description: "Donmus gecmise ait egitim mumu (1m)"
        required: true
        type: choice
        default: "90000"
        options: ["60000", "90000", "120000"]
      roundtrip_cost_bps:
        description: "Varsayimsal toplam masraf (baz puan)"
        required: true
        type: choice
        default: "12"
        options: ["8", "12", "20"]

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML research dependencies
        run: |
          python -m pip install -r requirements_training.txt
      - name: Compile check
        run: |
          python -m py_compile ml_features.py ml_features_v4.py ml_features_v41.py train_model_v4.py train_model_v41.py tests/test_v41_safety.py
      - name: Run safety tests
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
        run: |
          python -m unittest discover -s tests -p 'test_v41_safety.py' -v
      - name: Train offline LightGBM v4.1
        env:
          TIMI_SYMBOL: ${{ inputs.symbol }}
          TIMI_BARS: ${{ inputs.bars }}
          TIMI_COST: ${{ inputs.roundtrip_cost_bps }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
        run: |
          python train_model_v41.py \
            --symbol "$TIMI_SYMBOL" --interval 1m \
            --bars "$TIMI_BARS" --horizons 5 15 \
            --asof "2026-11-13T16:29:00+00:00" \
            --roundtrip-cost-bps "$TIMI_COST" \
            --target-atr 1.5 --stop-atr 1.0 \
            --out models_v41
      - name: Upload training research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TiMi-ML-v41-Research-Results
          path: models_v41/
          if-no-files-found: warn
          retention-days: 14
