          const assert=require('node:assert/strict');
          const s=require('./timi_pro_suite.js');
          const T=1763190000000,S=60000;
          const raw=Array.from({length:500},(_,i)=>{
            const c=100+Math.sin(i/8)*5+i*.01;
            return {t:T+i*S,o:c-.2,h:c+.7,l:c-1,c,v:2,closed:true};
          });
          const bars=s.validateBars(raw);
          assert.equal(bars.length,500);
          for(const strat of ['ema','rsi']){
            const r=s.computeBacktest(bars,strat,0.1,0.03);
            assert(Number.isFinite(r.equity));
            assert(r.trades.every(t=>t.exitAt>t.entryAt));
          }
          const order=s.snapshotBook({bids:[[100,2]],asks:[[101,2]]});
          assert.equal(order.bidNotional,200);
          console.log('VALIDATED: read-only data, EMA, RSI, next-candle execution and 20-level view');
          JS

      - name: Install 3 tabs plus safe SMC analyzer adapter
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,re

          html_path=Path('index.html')
          smc_path=Path('timi_smc_v12.js')
          module_path=Path('timi_pro_suite.js')
          html=html_path.read_text(encoding='utf-8')
          smc=smc_path.read_text(encoding='utf-8')
          addon=module_path.read_text(encoding='utf-8')

          def git_blob_sha(value):
              b=value.encode('utf-8')
              return hashlib.sha1(b'blob '+str(len(b)).encode('ascii')+b'\0'+b).hexdigest()

          if git_blob_sha(html)!='fd921c99cbe37bfac124de703b50c6b0e60326aa':
              raise ValueError('index.html surumu degismis; guvenlik icin durduruldu')
          if git_blob_sha(smc)!='e9d71266877fad980783b97f77ba1725bfc8711e':
              raise ValueError('SMC v1.3 surumu degismis; guvenlik icin durduruldu')
          if 'id="timi-pro-suite-v14"' in html or 'timiSmcReadOnly' in smc:
              raise ValueError('PRO LAB daha once eklenmis veya dosyalar degismis')
          anchor='  if(!root||!root.document)return;'
          if smc.count(anchor)!=1:
              raise ValueError('SMC entegrasyon yeri tekil degil')
          adapter=(
              '  // Public, read-only SMC analyzer for the three-tab research suite.\n'
              '  if(root && root.document && !root.timiSmcReadOnly){\n'
              '    root.timiSmcReadOnly=Object.freeze({\n'
              '      analyzeClosedBars: (bars,tf)=>analyzeClosedBars(bars,tf),\n'
              '      onlyClosed: (bars,tf,time)=>onlyClosed(bars,tf,time)\n'
              '    });\n'
              '  }\n'
          )
          next_smc=smc.replace(anchor,adapter+anchor,1)
          tag='<script id="timi-smc-1-2">'
          if html.count(tag)!=1:
              raise ValueError('SMC script bulunamadi veya iki kez eklendi')
          pos=html.index(tag)+len(tag)
          end=html.index('</script>',pos)
          if html[pos:end].strip()!=smc.strip():
              raise ValueError('SMC HTML ve GitHub JS dosyasi farkli')
          updated=html[:pos]+'\n'+next_smc.rstrip()+'\n'+html[end:]
          body_end=re.search(r'</body>\s*</html>\s*$',updated,re.I)
          if not body_end:
              raise ValueError('HTML sonunda body/html kapanisi yok')
          install=('<!-- TiMi PRO LAB v1.4: 3 professional research tabs; no trade orders -->\n'
                   '<script id="timi-pro-suite-v14">\n'+addon.rstrip()+'\n</script>\n')
          updated=updated[:body_end.start()]+install+updated[body_end.start():]
          keep=('id="overview"','id="chart"','id="flow"','id="more"',
                'id="timiProCockpit"','id="timi-meta-widget-inline"',
                'id="timi-smc-1-2"','id="timi-kline-10-1-0"',
                'timiSmcDisplayOptions','id="timiTpChart"')
          for protected in keep:
              if protected not in updated:raise ValueError('Korunan alan kayip: '+protected)
          if updated.count('<script')!=updated.count('</script>'):
              raise ValueError('HTML script etiket sayisi uyumsuz')
          if updated.count('id="timi-pro-suite-v14"')!=1:
              raise ValueError('PRO LAB birden fazla eklendi')

          smc_path.write_text(next_smc,encoding='utf-8')
          html_path.write_text(updated,encoding='utf-8')
          print('PRO LAB installed: 3 tabs, SMC adapter, 2 strategy tests')
          print('Existing signal engine, main.py, WebSocket and ML remain unchanged')
          PYCODE
          node --check timi_smc_v12.js
          node --check timi_pro_suite.js
          git diff --check

      - name: Upload 30-day original backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-before-pro-lab-${{ github.run_number }}
          path: |
            index_before_pro_lab.html
            timi_smc_before_pro_lab.js
          retention-days: 30
          if-no-files-found: error

      - name: Commit only changed interface files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html timi_smc_v12.js timi_pro_suite.js
          git diff --cached --check
          files=$(git diff --cached --name-only)
          test "$files" = "$(printf 'index.html\ntimi_pro_suite.js\ntimi_smc_v12.js')"
          git commit -m 'Install TiMi PRO LAB: live order flow, multi-TF SMC, research backtest'
          git push origin HEAD:main
