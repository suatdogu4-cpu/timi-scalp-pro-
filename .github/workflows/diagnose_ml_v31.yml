name: TiMi ML v3.1 Read-only Error Audit

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Analiz donemi (ilk deneme: prospective)"
        type: choice
        required: true
        default: prospective
        options:
          - prospective
          - historical
          - both

permissions:
  contents: read

jobs:
  audit:
    name: Frozen ML v3 diagnostic only (NO TRADE)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_training.txt
      - name: Check code and immutable model archive
        run: |
          python -m py_compile diagnose_ml_v31.py ml_features.py
          test -f 'TiMi-ML-v3-Research-Results(1).zip' || (echo "Missing frozen ZIP in repository root"; exit 1)
      - name: Run frozen, read-only diagnostics
        env:
          AUDIT_SCOPE: ${{ inputs.scope }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
        run: |
          python diagnose_ml_v31.py \
            --models-zip 'TiMi-ML-v3-Research-Results(1).zip' \
            --scope "$AUDIT_SCOPE" \
            --out v31_audit
      - name: Upload diagnostic tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TiMi-ML-v3-1-Diagnostic-Results
          path: v31_audit/
          if-no-files-found: warn
          retention-days: 14
