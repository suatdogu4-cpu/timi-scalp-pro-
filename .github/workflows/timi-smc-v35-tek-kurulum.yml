name: TiMi - SMC PRO 3.5 Tek Kurulum

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timi-smc-pro-35-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Backup existing UI
        shell: bash
        run: cp index.html index_before_smc35.html
      - name: Install SMC PRO 3.5 with SHA and module safety checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,re

          def gitsha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()

          page=Path('index.html')
          original=page.read_bytes()
          if gitsha(original)!='45a23008ae2af0ae6b4f4310fe28db38ea559efe':
