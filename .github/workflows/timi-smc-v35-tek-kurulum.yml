      - name: Validate JS and tests
        shell: bash
        run: |
          set -euo pipefail
          node --check timi_smc_pro_v35.js
          node test_timi_smc_pro_v35.js
          git diff --check
      - name: Backup original index for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-before-smc35-${{ github.run_number }}
          path: index_before_smc35.html
          retention-days: 30
          if-no-files-found: error
      - name: Commit only read-only SMC UI and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html timi_smc_pro_v35.js test_timi_smc_pro_v35.js
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$(printf 'index.html\ntest_timi_smc_pro_v35.js\ntimi_smc_pro_v35.js')"
          git commit -m 'TiMi SMC PRO 3.5 add read-only quality and optional chart overlays'
          git push origin HEAD:main
