      - name: Back up previous UI for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timi-before-v15-${{ github.run_number }}
          path: |
            timi_index_before_v15.html
            timi_pro_suite_before_v15.js
          retention-days: 30
          if-no-files-found: error
      - name: Commit only read-only UI files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html timi_pro_v15.js
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$(printf 'index.html\ntimi_pro_v15.js')"
          git commit -m 'TiMi PRO LAB v1.5 live 16-rule alignment; remove duplicate Flow tab'
          git push origin HEAD:main
