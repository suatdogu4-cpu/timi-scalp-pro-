name: TiMi PRO LAB v1.5 - Canli Strateji Uyum ve Akis Sekmesi Kaldirma

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timi-pro-v15-single-install
  cancel-in-progress: false

jobs:
  install_v15:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Back up original interface
        shell: bash
        run: |
          set -euo pipefail
          cp index.html timi_index_before_v15.html
          cp timi_pro_suite.js timi_pro_suite_before_v15.js
      - name: Install 16-rule live analysis without changing main.py
