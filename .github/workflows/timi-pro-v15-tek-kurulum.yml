          import gzip,base64,hashlib,re

          def gitsha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode('ascii')+b'\0'+data).hexdigest()
          html=Path('index.html')
          pro=Path('timi_pro_suite.js')
          original=html.read_bytes()
          pro_bytes=pro.read_bytes()
          expected_html='af2eab9adb74231eeb1ab7f07477fc54dd57ff1d'
          expected_pro='3bc5f236c2a7c6380db496d138fc3c4b09e8767a'
          if gitsha(original)!=expected_html:
              raise ValueError('index.html degismis: guvenlik icin v1.5 durduruldu. Yeni surumu kontrol edin.')
          if gitsha(pro_bytes)!=expected_pro:
              raise ValueError('PRO LAB v1.4 degismis: guvenlik icin v1.5 durduruldu.')
          text=original.decode('utf-8')
          if 'id="timi-pro-v15"' in text or Path('timi_pro_v15.js').exists():
